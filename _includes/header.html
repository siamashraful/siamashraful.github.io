<header class="site-header" role="banner">
  <div class="container site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Siam Ashraful — home">
      <span class="wordmark__tick" aria-hidden="true">▲</span>SIAM ASHRAFUL
    </a>
    <nav class="site-nav" aria-label="Primary">
      {% for item in site.data.nav %}
      {% assign is_current = false %}
      {% if page.url == item.url %}{% assign is_current = true %}{% endif %}
      {% if item.url == '/blog/' and page.layout == 'post' %}{% assign is_current = true %}{% endif %}
      <a href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch colour theme">
        <span data-theme-icon aria-hidden="true">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 12.79A9 9 0 0111.21 3a7 7 0 109.79 9.79z"></path></svg>
        </span>
      </button>
    </nav>
  </div>
  <span class="scroll-progress" data-scroll-progress aria-hidden="true"></span>
</header>
