{% seo title=false %}
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c10">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7">
<link rel="icon" href="{{ '/assets/img/avatar.svg' | relative_url }}" type="image/svg+xml">
{% if site.analytics.ga4_id and site.analytics.ga4_id != "" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.ga4_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.analytics.ga4_id }}');
</script>
{% endif %}
