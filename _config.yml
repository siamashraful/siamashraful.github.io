title: "Siam Ashraful"
tagline: "Investment Analyst — Underwriting the AI transition"
description: "Investment Analyst at Invest Nova Scotia — sourcing and evaluating ICT & AI startups in the compute transition, with diligence discipline built on data lineage at RBC. Halifax, Nova Scotia."
url: "https://siamashraful.github.io"
baseurl: ""
lang: en-CA
timezone: America/Halifax
author:
  name: "Siam Ashraful"
  email: "siamashraful@gmail.com"
  location: "Halifax, Nova Scotia"
  pronouns: "he/him"
  social:
    linkedin: "https://www.linkedin.com/in/siam-ashraful/"
    github: "https://github.com/siamashraful"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - docs/
  - vendor/

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

logo: /assets/img/avatar.svg

sass:
  style: compressed

analytics:
  ga4_id: ""

footer:
  links:
    - label: LinkedIn
      url: "https://www.linkedin.com/in/siam-ashraful/"
    - label: GitHub
      url: "https://github.com/siamashraful"
