---
layout: default
---
<article class="page">
  <div class="container">
    <header class="page-header" data-reveal>
      <span class="eyebrow">{{ page.eyebrow | default: page.title }}</span>
      <h1>{{ page.heading | default: page.title }}</h1>
      {% if page.description %}<p class="page-description lead">{{ page.description }}</p>{% endif %}
    </header>
    <section class="page-content">
      {{ content }}
    </section>
  </div>
</article>
