<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="no-js">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.remove('no-js');

      function setTheme(theme) {
        if (theme === 'dark' || theme === 'light') {
          root.setAttribute('data-theme', theme);
          return true;
        }
        return false;
      }

      try {
        if (setTheme(localStorage.getItem('theme'))) {
          return;
        }
      } catch (err) {
        /* localStorage may be unavailable; ignore */
      }

      var prefersDark = true;
      try {
        prefersDark = !window.matchMedia('(prefers-color-scheme: light)').matches;
      } catch (err) {
        /* default dark */
      }

      setTheme(prefersDark ? 'dark' : 'light');
    })();
  </script>
  <script>
    try {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion-ok');
      }
    } catch (err) { /* stay static */ }
  </script>
  {% include head/custom.html %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="page-shell">
    {% include header.html %}
    <main id="content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
